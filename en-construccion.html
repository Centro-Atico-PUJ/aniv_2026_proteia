<head>
<meta charset="utf-8">

<title>En construcción — proteia</title>
<style>
@font-face{font-family:"Jauria";src:url("tipo/jauria.otf") format("opentype");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"Jauria";src:url("tipo/jauria-Bold.otf") format("opentype");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"Jauria";src:url("tipo/jauria-Italic.otf") format("opentype");font-weight:400;font-style:italic;font-display:swap}

:root{
  --amarillo:#EDF486;
  --morado:#5E3986;
  --crema:#EEEEEE;
  --naranja:#FCB95C;
  --rosa:#CC426F;
  --tinta:#282828;

  --font-display:'Jauria','Podkova','Bitter',Georgia,'Times New Roman',serif;
  --font-body:'Jauria','Source Serif 4','PT Serif',Georgia,'Times New Roman',serif;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;
  min-height:100svh;
  display:flex;
  flex-direction:column;
  background:var(--amarillo);
  color:var(--tinta);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

main{
  position:relative;
  flex:1 1 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(48px,8vw,110px) clamp(20px,6vw,60px);
  overflow:hidden;
}
.blob{
  position:absolute;
  border-radius:50%;
  z-index:0;
  opacity:.55;
}
.blob--rosa{width:clamp(160px,22vw,320px);background:var(--rosa);top:-6%;left:-6%}
.blob--morado{width:clamp(140px,18vw,260px);background:var(--morado);bottom:-8%;right:-4%}
.blob--naranja{width:clamp(90px,12vw,160px);background:var(--naranja);bottom:8%;left:6%}

.wrap{position:relative;z-index:1;width:100%;max-width:600px;text-align:center}

.eye{
  display:block;
  width:clamp(90px,14vw,140px);
  height:auto;
  margin:0 auto clamp(22px,3.4vw,34px);
  animation:blink 4.5s ease-in-out infinite;
  transform-origin:center;
}
@keyframes blink{
  0%,92%,100%{transform:scaleY(1)}
  95%{transform:scaleY(.12)}
}

.eyebrow{
  margin:0 0 .6em;
  font-family:var(--font-display);
  font-size:clamp(13px,1.4vw,16px);
  letter-spacing:.22em;
  text-transform:uppercase;
  color:var(--rosa);
}
h1{
  margin:0 0 .5em;
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(30px,5.4vw,52px);
  line-height:1.15;
}
p{
  margin:0 auto;
  max-width:46ch;
  font-size:clamp(15px,1.7vw,19px);
  line-height:1.7;
}
.cta{
  display:inline-block;
  margin-top:clamp(26px,3.6vw,38px);
  padding:.9em 1.8em;
  border-radius:999px;
  background:var(--morado);
  color:var(--crema);
  text-decoration:none;
  font-family:var(--font-display);
  font-weight:500;
  font-size:clamp(15px,1.5vw,18px);
  box-shadow:0 6px 18px rgba(40,40,40,.2);
  transition:transform .2s ease,background .2s ease;
}
.cta:hover,.cta:focus-visible{background:#79509f;transform:translateY(-2px)}
.cta:focus-visible{outline:2px solid var(--tinta);outline-offset:3px}

/* ---------- Barra de navegacion ---------- */
.nav{
  position:relative;
  z-index:1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:clamp(12px,2.2vw,28px);
  min-height:clamp(56px,5.6vw,80px);
  padding:10px clamp(18px,3.8vw,52px);
  background:var(--naranja);
  color:var(--morado);
}
.brand{
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  flex:none;
  color:var(--morado);
  text-decoration:none;
  font-family:var(--font-display);
  font-weight:500;
  font-size:clamp(19px,2.1vw,30px);
  line-height:.87;
}
.brand__tag{font-size:.13em;letter-spacing:.05em;margin-top:.55em;white-space:nowrap}
.nav__links{
  display:flex;
  align-items:center;
  justify-content:flex-end;
  flex-wrap:wrap;
  gap:clamp(12px,3.2vw,44px);
}
.nav__links a{
  font-family:var(--font-display);
  font-weight:400;
  font-size:clamp(13px,1.25vw,18px);
  color:var(--morado);
  text-decoration:none;
}
.nav__links a:hover{text-decoration:underline;text-underline-offset:.2em}
.nav__links a[aria-current="page"]{
  text-decoration:underline;
  text-underline-offset:.2em;
  text-decoration-thickness:2px;
}
.nav__links a[href="retos.html"]{font-weight:700}
.nav__has-sub{position:relative;display:inline-flex;align-items:center}
.nav__caret{margin-left:.3em;font-size:.85em;opacity:.75}
.nav__submenu{list-style:none;margin:0;padding:8px;position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);min-width:176px;background:var(--morado);border-radius:14px;box-shadow:0 12px 30px rgba(40,40,40,.32);opacity:0;visibility:hidden;transition:opacity .16s ease;z-index:20}
.nav__has-sub:hover > .nav__submenu,
.nav__has-sub:focus-within > .nav__submenu{opacity:1;visibility:visible}
.nav__submenu li{margin:0}
.nav__submenu a{display:block;padding:8px 14px;border-radius:8px;white-space:nowrap;color:var(--crema)}
.nav__submenu a:hover{background:rgba(255,255,255,.14)}
.nav__submenu a[aria-current="page"]{background:rgba(255,255,255,.18)}

a:focus-visible{outline:2px solid var(--tinta);outline-offset:4px;border-radius:6px}

@media (max-width:860px){
  .nav{flex-direction:column;justify-content:center;gap:20px;padding:26px 20px}
  .brand{align-items:center}
  .nav__links{justify-content:center;gap:18px 26px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
