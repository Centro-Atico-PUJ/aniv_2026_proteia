   ============================================================ */
:root{
  --cian:#5CD1FC;
  --negro:#000000;
  --tinta:#282828;
  --crema:#EEEEEE;

}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  height:100svh;
  overflow:hidden;
  background:var(--cian);
  color:var(--tinta);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
}
body{transition:opacity .7s ease}
body.page-leaving{opacity:0}

/* ---------- Lienzo ---------- */
.stage{
  position:relative;
  width:min(100%,140.625svh);
  height:min(100svh,71.111vw);
  aspect-ratio:1440/1024;
  margin:0 auto;
  container-type:inline-size;
  overflow:hidden;
}
.texture{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
}
.stage > *:not(.texture){position:absolute;z-index:1}

/* ---------- Titular ---------- */
.title{
  margin:0;
  left:26cqw;
  top:6.67cqw;
  width:66.5cqw;
  text-align:center;
  font-family:var(--font-display);
  font-weight:700;
  font-size:5.417cqw;
  line-height:1.44;
  color:var(--negro);
}
.title-line{
  display:block;
  width:max-content;
  max-width:100%;
  overflow:hidden;
  white-space:nowrap;
  clip-path:inset(0 100% 0 0);
}
.title-line:nth-child(1){animation:type-line-1 1.15s steps(19,end) forwards}
.title-line:nth-child(2){animation:type-line-2 1.2s steps(20,end) .95s forwards}
.title-line:nth-child(3){animation:type-line-3 1.2s steps(22,end) 1.95s forwards}
@keyframes type-line-1{to{clip-path:inset(0 0 0 0)}}
@keyframes type-line-2{to{clip-path:inset(0 0 0 0)}}
@keyframes type-line-3{to{clip-path:inset(0 0 0 0)}}

/* ---------- Definiciones ---------- */
.def{
  margin:0;
  font-size:2.431cqw;
  line-height:1.5;
  opacity:0;
  transform:translateY(10px);
  animation:concept-in .7s ease forwards;
}
.def--reimaginar{animation-delay:3.55s}
.def--imaginarios{animation-delay:4.25s}
@keyframes concept-in{to{opacity:1;transform:translateY(0)}}
.def strong{font-weight:700}
.def--reimaginar{left:15.21cqw;top:47.22cqw;width:29.51cqw}
.def--imaginarios{left:72.57cqw;top:40.21cqw;width:26.53cqw;text-align:center}

/* ---------- Figuras ---------- */
.fig{width:5.972cqw;height:auto}
.fig--sun{left:19.65cqw;top:8.33cqw}
.fig--coral{left:7.847cqw;top:47.15cqw}
.fig--blue{left:65.97cqw;top:38.68cqw}

/* ---------- Movil: la escena se apila ---------- */
@media (max-width:600px){
  .stage{
    display:flex;
    flex-direction:column;
    aspect-ratio:auto;
    height:100svh;
    min-height:100svh;
    overflow:hidden;
    padding:24px 20px 20px;
  }
  .stage > *:not(.texture){position:static;left:auto;top:auto;width:auto}
  .texture{height:auto;bottom:auto;aspect-ratio:1440/1024}
  .brk{display:block}
  .stage > .fig{width:56px}
  .fig--sun{order:1;margin-bottom:8px}
  .title{order:2;font-size:clamp(24px,6.8vw,32px);line-height:1.2;text-align:left;width:auto}
  .fig--coral{order:3;margin-top:16px}
  .def--reimaginar{order:4;margin-top:8px;font-size:clamp(15px,4.6vw,18px);line-height:1.35}
  .fig--blue{order:5;margin-top:16px}
  .def--imaginarios{order:6;margin-top:8px;font-size:clamp(15px,4.6vw,18px);line-height:1.35;text-align:left}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .title-line,.def{clip-path:none;opacity:1;transform:none}
}
