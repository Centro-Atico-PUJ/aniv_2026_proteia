<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>proteia — pedagogías para reimaginar</title>
<meta name="description" content="Proteia. Pedagogías para reimaginar: apropiación pública del conocimiento.">
<style>
/* ============================================================
   PROTEIA — sistema de diseño
   ============================================================ */
@font-face{
  font-family:'Jauria';
  src:url('tipografia/jauria.otf') format('opentype');
  font-weight:400;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:'Jauria';
  src:url('tipografia/jauria-Bold.otf') format('opentype');
  font-weight:700;
  font-style:normal;
  font-display:swap;
}
@font-face{
  font-family:'Jauria';
  src:url('tipografia/jauria-Italic.otf') format('opentype');
  font-weight:400;
  font-style:italic;
  font-display:swap;
}
:root{
  --ink:      #282828;
  --ink-card: #333333;
  --orange:   #FCB95C;
  --purple:   #5E3986;
  --cream:    #F2DBBB;
  --pink:     #F85E84;
  --cyan:     #5CD1FC;
  --violet:   #776DFF;
  --yellow:   #EDF486;

  --bar: 54px;
  --pad: clamp(20px, 5vw, 72px);

  --display: 'Jauria', serif;
  --body: 'Jauria', serif;
}

*,*::before,*::after{ box-sizing:border-box; }
html{ scroll-behavior:smooth; -webkit-text-size-adjust:100%; }
body{
  margin:0;
  padding-bottom:var(--bar);
  font-family:var(--body);
  background:var(--orange);
  color:var(--purple);
  overflow-x:hidden;
}
body.page-leaving #loader{opacity:0}
img,svg{ display:block; max-width:100%; }
a{ color:inherit; }
::selection{ background:var(--purple); color:var(--orange); }

:focus-visible{
  outline:3px solid var(--purple);
  outline-offset:4px;
  border-radius:2px;
}
.dark :focus-visible{ outline-color:var(--yellow); }

.sr{
  position:absolute; width:1px; height:1px;
  padding:0; margin:-1px; overflow:hidden;
  clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

/* ============================================================
   1. PANTALLA DE CARGA — el signo que cambia de forma
   ============================================================ */
#loader{
  position:fixed; inset:0; z-index:100;
  background:var(--ink);
  display:grid; place-items:center;
  transition:background .75s ease, opacity .9s ease .15s, visibility 0s linear 1.05s;
}
#loader.done{ opacity:0; visibility:hidden; }
#loader.motto{ background:#5CD1FC; }
#lmark{ width:min(46vw,300px); height:auto; }
#loader #lmark{ transition:opacity .55s ease, transform .7s cubic-bezier(.22,1,.36,1); }
#loader.motto #lmark{ opacity:0; transform:scale(.82); }
.loader-motto{
  position:absolute; inset:0; display:flex; align-items:center;
  padding:var(--pad); text-align:left;
  color:var(--ink); opacity:0; transform:translateY(18px);
  transition:opacity .75s ease, transform .75s cubic-bezier(.22,1,.36,1);
  pointer-events:none;
}
#loader.motto .loader-motto{ opacity:1; transform:none; }

.motto-inner{ position:relative; z-index:1; width:100%; max-width:760px; }
.motto-q{
  display:flex; align-items:flex-start; gap:clamp(10px,2vw,18px);
  margin:0; font-family:var(--display); font-weight:700;
  font-size:clamp(34px,6.6vw,74px); line-height:1.1; max-width:14ch;
}
.motto-q img{ width:clamp(34px,4.8vw,58px); height:auto; flex:none; margin-top:.15em; }
#motto-text::after{
  content:'';
  display:inline-block; width:.07em; height:.85em; margin-left:.04em;
  background:currentColor; vertical-align:-.08em;
  animation:blink 1s step-end infinite;
}
@keyframes blink{ 50%{ opacity:0; } }
.motto-defs{
  display:flex; flex-wrap:wrap; gap:clamp(22px,4vw,60px);
  margin:clamp(32px,5vw,54px) 0 0;
}
.motto-def{ display:flex; align-items:flex-start; gap:16px; max-width:26ch; }
.motto-def img{ width:clamp(50px,7.8vw,96px); height:auto; flex:none; }
.motto-def p{ margin:0; font-size:clamp(18px,2.5vw,29px); line-height:1.5; }
.motto-def b{ font-family:var(--display); font-weight:700; }
.motto-def i{ font-style:italic; opacity:.75; }

/* En pantallas amplias, la composición se distribuye igual que en la referencia. El
   lienzo mide lo mismo que img/FraseInicio.svg (1292x914.76) y se centra igual que
   la trama de fondo, así el título cae siempre dentro del mismo hueco sin textura,
   sin importar el ancho de la ventana. */
@media(min-width:760px){
  .motto-inner{
    position:absolute; top:50%; left:50%;
    width:1292px; height:914.76px; max-width:none;
    transform:translate(-50%,-50%);
  }
  .motto-q{
    position:absolute; top:17%; left:22%; width:56%; right:auto;
    justify-content:flex-start; text-align:left; max-width:none;
    font-weight:700; font-size:clamp(34px,4vw,64px);
  }
  #motto-text{ display:block; flex:1; }
  .motto-def{ position:absolute; margin:0; width:450px; max-width:none; }
  .motto-def.def-reimaginar{ left:16%; top:64%; }
  .motto-def.def-imaginarios{ left:66%; top:56%; }
}

#skip{
  position:absolute; left:50%; bottom:8vh; transform:translateX(-50%);
  background:none; border:0; cursor:pointer;
  font-family:var(--body); font-size:11px; font-weight:500;
  letter-spacing:.22em; text-transform:uppercase;
  color:#8a8a8a; padding:10px 14px;
  opacity:0; transition:opacity .5s ease, color .25s ease;
}
#skip.on{ opacity:1; }
#skip:hover{ color:var(--yellow); }

/* ============================================================
   2. TEXTURAS — trama de llaves
   ============================================================ */
.tex{ position:absolute; pointer-events:none; z-index:0; }
.tex-tl{ top:0; left:0; width:min(32%,300px); height:120px; }
.tex-br{ right:0; bottom:0; width:min(56%,600px); height:205px; }

/* aparición: la trama se dibuja desde su borde de anclaje */
.scene .tex-tl{ clip-path:inset(0 0 100% 0); transition:clip-path 1.1s cubic-bezier(.22,1,.36,1) .1s, opacity .8s ease; }
.scene .tex-br{ clip-path:inset(100% 0 0 0); transition:clip-path 1.3s cubic-bezier(.22,1,.36,1) .28s, opacity .8s ease; }
.revealed .scene .tex-tl,
.revealed .scene .tex-br{ clip-path:inset(0 0 0 0); }

/* En el Index la trama se concentra en las dos esquinas de la referencia. */
.hero .tex-tl{
  clip-path:polygon(0 0,100% 0,100% 28%,80% 28%,80% 48%,60% 48%,60% 68%,40% 68%,40% 88%,0 88%);
  opacity:0; transition:opacity .8s ease .1s;
}
.hero .tex-br{
  clip-path:polygon(60% 12%,100% 12%,100% 100%,0 100%,0 72%,20% 72%,20% 52%,40% 52%,40% 32%,60% 32%);
  opacity:0; transition:opacity .8s ease .28s;
}
.revealed .hero .tex-tl,
.revealed .hero .tex-br{ opacity:1; }

/* En la pantalla de carga: la trama encaja a lo alto de la pantalla, centrada. */
.tex-full{
  inset:0; width:100%; height:100%;
  background-image:url('img/FraseInicio.svg');
  background-repeat:no-repeat;
  background-position:center;
  background-size:auto 100%;
  opacity:0; transition:opacity .9s ease .1s;
}
#loader.motto .tex-full{ opacity:1; }

/* ============================================================
   3. ESTRUCTURA DE SECCIONES
   ============================================================ */
.scene{
  position:relative;
  min-height:calc(100svh - var(--bar));
  display:flex; flex-direction:column; justify-content:center;
  padding:calc(var(--pad) + 40px) var(--pad);
  overflow:hidden;
}
.scene > *:not(.tex){ position:relative; z-index:1; }
.dark{ background:var(--ink); color:var(--cream); }

/* ---- menu flotante ---- */
.floating-menu{
  position:fixed; top:clamp(14px,3vw,30px); left:clamp(14px,3vw,42px); z-index:20;
  display:flex; align-items:center; gap:14px;
}
.menu-toggle{
  width:clamp(42px,5vw,54px); height:clamp(42px,5vw,54px);
  padding:0; border:0; border-radius:50%; background:none; cursor:pointer;
  transition:transform .35s cubic-bezier(.22,1,.36,1);
}
.menu-toggle:hover,.menu-toggle:focus-visible{ transform:scale(1.08); }
.menu-toggle svg{ width:100%; height:100%; }
.menu-panel{
  display:flex; flex-direction:column; gap:12px;
  min-width:148px; padding:18px 20px;
  background:var(--purple); color:var(--cream);
  opacity:0; transform:translateX(-12px); pointer-events:none;
  transition:opacity .3s ease, transform .3s cubic-bezier(.22,1,.36,1);
}
.floating-menu.open .menu-panel{ opacity:1; transform:none; pointer-events:auto; }
.menu-panel a{
  font-family:var(--display); font-size:16px; line-height:1;
  text-decoration:none; transition:color .2s ease, transform .2s ease;
}
.menu-panel a:hover,.menu-panel a:focus-visible{ color:var(--yellow); transform:translateX(4px); }
@media(max-width:560px){
  .floating-menu{ left:12px; }
  .menu-panel{ min-width:132px; padding:16px; }
}

/* ---- héroe ---- */
.hero{ align-items:center; text-align:center; }
.wordmark{ display:flex; flex-direction:column; align-items:center; width:100%; }

/* el logo entra como dos llaves cerradas en el centro que se separan
   y descubren "proteia" al llegar a su lugar. Son tres copias de la
   misma imagen apiladas: una recortada a solo la llave izquierda,
   otra a solo la derecha, y el logo completo debajo (oculto hasta
   que las llaves terminan de abrirse). */
.mark{
  position:relative; margin:0 auto;
  width:min(92%,980px); aspect-ratio:1044/267;
}
.mark img{ position:absolute; inset:0; width:100%; height:100%; display:block; }

.mark-full{ opacity:0; transition:opacity .7s ease .9s; }
.revealed .hero .mark-full{ opacity:1; }

.mark-brace{ transition:transform 1.05s cubic-bezier(.65,0,.35,1) .35s; }
.mark-brace-l{ clip-path:inset(0 92% 0 0); transform:translateX(46%); }
.mark-brace-r{ clip-path:inset(0 0 0 92%); transform:translateX(-46%); }
.revealed .hero .mark-brace-l,
.revealed .hero .mark-brace-r{ transform:translateX(0); }

@media (prefers-reduced-motion:reduce){
  .mark-full{ opacity:1; transition:none; }
  .mark-brace-l,.mark-brace-r{ transform:translateX(0); transition:none; }
}

.hero .lede{
  max-width:34ch; margin:clamp(26px,4vw,44px) auto 0;
  font-size:clamp(15px,1.6vw,18px); line-height:1.55;
  opacity:0; transition:opacity .8s ease 1.5s;
}
.revealed .hero .lede{ opacity:.85; }

.cue{
  position:absolute; left:50%; bottom:clamp(20px,4vh,44px); transform:translateX(-50%);
  font-size:10px; font-weight:500; letter-spacing:.24em; text-transform:uppercase;
  text-decoration:none; opacity:0; transition:opacity .8s ease 1.8s;
  display:flex; flex-direction:column; align-items:center; gap:8px;
}
.revealed .cue{ opacity:.6; }
.cue:hover{ opacity:1; }
.cue span{ display:block; width:1px; height:26px; background:currentColor; animation:drop 2.4s ease-in-out infinite; }
@keyframes drop{ 0%,100%{ transform:scaleY(.4); transform-origin:top; } 50%{ transform:scaleY(1); transform-origin:top; } }

/* ---- sección llaves ---- */
.hold{ align-items:center; text-align:center; }
.hold-inner{
  display:flex; align-items:center; justify-content:center;
  gap:clamp(14px,4vw,52px); width:min(100%,940px);
}
.hold-inner svg{ height:clamp(140px,26vw,320px); width:auto; flex:none; }
.hold p{
  font-family:var(--display); font-weight:400;
  font-size:clamp(19px,2.5vw,30px); line-height:1.35;
  margin:0; max-width:26ch;
}

/* ============================================================
   4. BARRA INFERIOR — la franja morada, fija
   ============================================================ */
.bar{
  position:fixed; left:0; right:0; bottom:0; height:var(--bar); z-index:50;
  background:var(--purple); color:var(--cream);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 var(--pad);
  font-size:11px; font-weight:500; letter-spacing:.2em; text-transform:uppercase;
}
.bar nav{ display:flex; gap:clamp(14px,2.4vw,30px); }
.bar a{ text-decoration:none; opacity:.72; transition:opacity .25s ease; }
.bar a:hover{ opacity:1; }
.bar .sig{ opacity:.9; font-family:var(--display); letter-spacing:.14em; font-size:13px; }
@media(max-width:560px){
  .bar .n-hide{ display:none; }
}

/* ---- revelado por scroll ---- */
.up{ opacity:0; transform:translateY(24px); transition:opacity .8s ease, transform .8s cubic-bezier(.22,1,.36,1); }
.up.in{ opacity:1; transform:none; }

@media (prefers-reduced-motion:reduce){
  html{ scroll-behavior:auto; }
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  .up{ opacity:1; transform:none; }
}
</style>
</head>
<body>

<!-- ====== definiciones svg ====== -->
<svg width="0" height="0" aria-hidden="true" style="position:absolute">
  <defs>
    <!-- llave vertical: cúspide a la izquierda -->
    <path id="brace" d="M46 6 C24 10 32 40 30 66 C29 84 20 94 6 100 C20 106 29 116 30 134 C32 160 24 190 46 194"/>
    <!-- onda de la trama: silueta de img/Vector.svg, repetida en hilera -->
    <path id="wave" d="M135 38.2329C135 39.0361 134.841 40 131.193 40C131.193 35.1807 126.91 30.5221 126.91 30.5221C126.91 30.5221 125.323 26.0241 113.584 26.0241C111.363 26.0241 108.508 26.1847 105.494 26.6667L80.5875 29.8795L79.7944 29.8795C71.5452 29.8795 67.1034 12.0482 67.1034 12.0482L65.8343 12.6908C65.8343 13.1727 62.8202 27.7912 53.9366 27.7912L28.396 25.8634C24.1128 25.8634 13.4841 26.3454 10.6287 28.4337C7.61457 30.5221 3.64865 40 3.64865 40L0 39.0361C0 34.8594 4.60048 15.1004 19.8296 15.1004C26.4924 15.1004 36.1692 18.7952 40.9283 18.7952C44.7356 18.7952 56.792 16.3855 56.792 16.3855L62.8202 1.44578L69.483 0C69.483 2.08835 77.4148 17.6707 77.4148 17.6707C77.4148 17.6707 88.2021 20.0803 93.2785 20.0803L111.204 15.261C132.62 15.261 135 34.8594 135 38.2329Z"/>
    <pattern id="tex" width="135" height="80" patternUnits="userSpaceOnUse">
      <g fill="#D9D9D9">
        <use href="#wave"/>
        <use href="#wave" x="-67.5" y="40"/>
        <use href="#wave" x="67.5" y="40"/>
      </g>
    </pattern>
    <mask id="mtl">
      <rect x="0" y="1"   width="100%" height="40" fill="#fff"/>
      <rect x="0" y="41"  width="88%"  height="40" fill="#fff"/>
      <rect x="0" y="81"  width="62%"  height="40" fill="#fff"/>
    </mask>
    <mask id="mbr">
      <rect x="38%" y="1"   width="30%"  height="40" fill="#fff"/>
      <rect x="26%" y="41"  width="58%"  height="40" fill="#fff"/>
      <rect x="10%" y="81"  width="88%"  height="40" fill="#fff"/>
      <rect x="4%"  y="121" width="96%"  height="40" fill="#fff"/>
      <rect x="0"   y="161" width="100%" height="40" fill="#fff"/>
    </mask>
  </defs>
</svg>

<!-- ====== 1. carga ====== -->
<div id="loader" role="status" aria-label="Cargando proteia">
  <svg viewBox="0 0 260 260" id="lmark" aria-hidden="true">
    <g id="lbraces" fill="none" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
      <use href="#brace" id="lb1"/>
      <use href="#brace" id="lb2"/>
    </g>
    <circle id="ld1" r="11" fill="#EDF486"/>
    <circle id="ld2" r="11" fill="#EDF486"/>
  </svg>
</div>

<script>
(function(){
  'use strict';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* --------------------------------------------------------
     Motor de la marca: dos llaves enfrentadas.
     Un solo parámetro las recorre — el espacio entre ellas —
     más la rotación del conjunto.
     -------------------------------------------------------- */
  var C = 130; // centro del viewBox 260

  var STATES = [
    { name:'reconocer', gap:  22, color:'#F85E84', d1:[  0,  0], d2:[  0,  0] },
    { name:'cruzar',    gap:  -8, color:'#5CD1FC', d1:[-34,-54], d2:[ 16,-70] },
    { name:'abrir',     gap:   6, color:'#776DFF', d1:[-52,-16], d2:[ 50,  2] }
  ];
  // recorrido: reconocer -> cruzar (sin girar) -> abrir (+90) -> reconocer (+90)
  var TURN = [0, 90, 90];
  var BASE = 270;
  function baseRot(i){ var r = BASE; for(var k=0;k<i;k++) r += TURN[k]; return r; }

  function ease(t){ return t<0.5 ? 4*t*t*t : 1-Math.pow(-2*t+2,3)/2; }
  function lerp(a,b,t){ return a+(b-a)*t; }
  function mixHex(a,b,t){
    var pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16);
    var r=Math.round(lerp(pa>>16, pb>>16, t));
    var g=Math.round(lerp((pa>>8)&255, (pb>>8)&255, t));
    var bl=Math.round(lerp(pa&255, pb&255, t));
    return 'rgb('+r+','+g+','+bl+')';
  }

  function makeMark(svg){
    var uses = svg.querySelectorAll('use');
    var dots = svg.querySelectorAll('circle');
    var group = svg.querySelector('g');
    return function apply(rot, gap, color, d1, d2){
      // llave izquierda espejada (cúspide hacia adentro)
      uses[0].setAttribute('transform','rotate('+rot+' '+C+' '+C+') translate('+(C-gap)+' '+(C-100)+') scale(-1,1)');
      uses[1].setAttribute('transform','rotate('+rot+' '+C+' '+C+') translate('+(C+gap)+' '+(C-100)+')');
      group.setAttribute('stroke', color);
      dots[0].setAttribute('cx', C+d1[0]); dots[0].setAttribute('cy', C+d1[1]);
      dots[1].setAttribute('cx', C+d2[0]); dots[1].setAttribute('cy', C+d2[1]);
    };
  }

  function poseAt(i, j, t){
    var a=STATES[i], b=STATES[j];
    return {
      rot: lerp(baseRot(i), baseRot(i)+TURN[i], t),
      gap: lerp(a.gap, b.gap, t),
      color: mixHex(a.color, b.color, t),
      d1: [lerp(a.d1[0],b.d1[0],t), lerp(a.d1[1],b.d1[1],t)],
      d2: [lerp(a.d2[0],b.d2[0],t), lerp(a.d2[1],b.d2[1],t)]
    };
  }
  function setPose(apply,p){ apply(p.rot,p.gap,p.color,p.d1,p.d2); }

  /* ---- animación continua del cargador ---- */
  var HOLD = 1000, MORPH = 620;
  var applyLoader = makeMark(document.getElementById('lmark'));

  var t0 = null, rafId;
  function loop(ts){
    if(t0===null) t0=ts;
    var cycle = (HOLD+MORPH)*STATES.length;
    var e = (ts-t0) % cycle;
    var idx = Math.floor(e/(HOLD+MORPH));
    var local = e - idx*(HOLD+MORPH);
    var t = local <= HOLD ? 0 : ease((local-HOLD)/MORPH);
    setPose(applyLoader, poseAt(idx, (idx+1)%STATES.length, t));
    rafId = requestAnimationFrame(loop);
  }

  if(reduce){
    setPose(applyLoader, poseAt(2, 2, 0));
  } else {
    rafId = requestAnimationFrame(loop);
  }

  setTimeout(function(){
    document.body.classList.add('page-leaving');
    setTimeout(function(){ window.location.href = 'gancho.html'; }, reduce ? 0 : 700);
  }, reduce ? 500 : 3800);

})();
</script>
</body>
</html>
